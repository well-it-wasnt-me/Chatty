  build-linux:
    name: Build Linux binary (Debian and Arch)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build JavaScript
        run: pnpm build
      - name: Package Linux x64 executable
        run: npx --yes @yao-pkg/pkg dist/index.js --targets node22-linux-x64 --output dist/chatty-linux-x64
      - name: Prepare distro-named assets
        run: |
          chmod +x dist/chatty-linux-x64
          cp dist/chatty-linux-x64 dist/chatty-linux-x64-debian
          cp dist/chatty-linux-x64 dist/chatty-linux-x64-arch
      - name: Upload Linux assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/chatty-linux-x64-debian dist/chatty-linux-x64-arch --clobber

  build-macos:
    name: Build macOS ${{ matrix.arch }} binary
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: node22-macos-x64
          - arch: arm64
            target: node22-macos-arm64
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build JavaScript
        run: pnpm build
      - name: Package macOS executable
        run: npx --yes @yao-pkg/pkg dist/index.js --targets "${{ matrix.target }}" --output "dist/chatty-macos-${{ matrix.arch }}"
      - name: Upload macOS asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "dist/chatty-macos-${{ matrix.arch }}" --clobber
